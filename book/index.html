<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Find a Time</title>
<!-- Everything this page shows comes from the part of the link after "#", which browsers never send anywhere.
     It makes no network requests. Picking a time opens your own email app with a short request. -->
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#1c1c1e;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.14);--tint:#1f74ff;--tint-soft:#e8f1ff;--yolk:#ffc21b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--tint:#0a84ff;--tint-soft:#0f2747}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.4 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.yolk{width:46px;height:46px;flex:none}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--label2);font-size:15px;margin:8px 0 22px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;border:0;border-radius:14px;background:var(--card);color:var(--label);padding:9px 10px;font:inherit;cursor:pointer;text-align:center}
.day small{display:block;font-size:12px;color:var(--label2);text-transform:uppercase;letter-spacing:.03em}
.day b{font-size:20px;font-weight:600}
.day.on{background:var(--tint);color:#fff}.day.on small{color:rgba(255,255,255,.8)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;background:var(--card);border-radius:16px;padding:12px}
.slot{border:1px solid var(--sep);background:none;color:var(--tint);border-radius:11px;padding:11px 0;font:600 16px var(--font);cursor:pointer}
.slot.on{background:var(--tint);color:#fff;border-color:var(--tint)}
.none{color:var(--label2);text-align:center;padding:26px 8px;background:var(--card);border-radius:16px}
form{margin-top:18px;background:var(--card);border-radius:16px;padding:6px 16px 16px}
label{display:block;font-size:13px;color:var(--label2);margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--sep);border-radius:11px;padding:11px 12px;font:17px var(--font);background:none;color:var(--label);outline:none}
input:focus,textarea:focus{border-color:var(--tint)}
textarea{min-height:70px;resize:vertical}
.go{margin-top:16px;width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;font:600 17px var(--font);padding:15px;cursor:pointer}
.go:disabled{opacity:.4}
.done{background:var(--card);border-radius:16px;padding:22px 18px;text-align:center}
.done h2{margin:6px 0 6px;font-size:22px}.done p{color:var(--label2);margin:6px 0}
pre{white-space:pre-wrap;text-align:left;background:var(--bg);border-radius:12px;padding:12px;font:14px/1.45 ui-monospace,Menlo,monospace;user-select:all}
.tz{color:var(--label2);font-size:13px;text-align:center;margin-top:16px}
.lnk{background:none;border:0;color:var(--tint);font:inherit;cursor:pointer;padding:6px}
/* a group link: everyone marks the times that work (like when-to-meet); busy says only "Busy" */
.grid{overflow-x:auto;background:var(--card);border-radius:16px;padding:10px 10px 12px;-webkit-overflow-scrolling:touch}
.grid table{border-collapse:separate;border-spacing:3px;margin:0 auto}
.grid th{font:600 12px var(--font);color:var(--label2);padding:2px 4px;white-space:nowrap}.grid th b{display:block;font-size:16px;color:var(--label)}
.grid td.tm{font:500 11px var(--font);color:var(--label2);text-align:right;padding-right:6px;white-space:nowrap;position:sticky;left:0;background:var(--card)}
.cell{width:46px;height:30px;border:0;border-radius:7px;background:var(--tint-soft);cursor:pointer;padding:0;touch-action:manipulation}
.cell.on{background:#34c759}.cell.busy{background:repeating-linear-gradient(135deg,var(--bg) 0 5px,transparent 5px 10px);cursor:not-allowed;
  font:500 9px var(--font);color:var(--label2)}
.cell.none{visibility:hidden}
.legend{display:flex;gap:14px;justify-content:center;margin:10px 0 0;font-size:13px;color:var(--label2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:#34c759}
.legend i.b{background:repeating-linear-gradient(135deg,var(--sep) 0 3px,transparent 3px 6px)}
</style>
</head>
<body>
<main id="app"><p class="sub">Loading…</p></main>
<script>
"use strict";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YOLK=`<svg class="yolk" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="g" cx=".36" cy=".28" r=".9"><stop offset="0" stop-color="#fff0b8"/><stop offset=".42" stop-color="#ffd84d"/><stop offset=".85" stop-color="#ffc21b"/><stop offset="1" stop-color="#f2a800"/></radialGradient></defs><path d="M60 20C89 20 107 43 107 69C107 93 87 105 60 105C33 105 13 93 13 69C13 43 31 20 60 20Z" fill="url(#g)"/><ellipse cx="48.5" cy="62" rx="4.6" ry="7.2" fill="#0e1424"/><ellipse cx="71.5" cy="62" rx="4.6" ry="7.2" fill="#0e1424"/><path d="M55.5 73q4.5 4.5 9 0" stroke="#0e1424" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`;
function fail(msg){app.innerHTML=`<div class="top">${YOLK}<h1>Find a time</h1></div><p class="sub">${esc(msg)}</p>`;}

async function read(){
  const h=location.hash.slice(1); if(!h) throw new Error("This link is incomplete. Ask for a new one.");
  const b64=h.replace(/-/g,"+").replace(/_/g,"/"), bin=atob(b64+"===".slice((b64.length+3)%4));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const stream=new Response(bytes).body.pipeThrough(new DecompressionStream("deflate"));
  const d=JSON.parse(await new Response(stream).text());
  if(d.v!==1) throw new Error("This link is from a newer version. Ask for a new one.");
  return d;
}

function slots(d){
  const M=60000, s=d.s*M, end=(d.s+d.x)*M, step=Math.min(30,d.m)*M, len=d.m*M;
  const raw=(d.b?d.b.split(","):[]).map(x=>parseInt(x,36));
  const busy=[]; for(let i=0;i+1<raw.length;i+=2) busy.push([s+raw[i]*M,s+raw[i+1]*M]);
  const tz=d.tz||undefined, fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,hour:"2-digit",minute:"2-digit",weekday:"short"});
  const ownerTime=t=>{const p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return {min:(+p.hour%24)*60+(+p.minute),wd:p.weekday};};
  const out=[]; let t=Math.max(s,Math.ceil((Date.now()+60*M)/(30*M))*30*M);
  for(;t+len<=end;t+=step){
    const a=ownerTime(t), b=a.min+d.m;
    if(a.min<d.h[0]*60||b>d.h[1]*60) continue;
    if(!d.w&&(a.wd==="Sat"||a.wd==="Sun")) continue;
    if(busy.some(([x,y])=>x<t+len&&y>t)) continue;
    out.push(t);
  }
  return out;
}

function cells(d){   // every slot in the window, busy ones marked (a group link shows them, as "Busy")
  const M=60000, s=d.s*M, end=(d.s+d.x)*M, step=Math.min(30,d.m)*M, len=d.m*M;
  const raw=(d.b?d.b.split(","):[]).map(x=>parseInt(x,36));
  const busy=[]; for(let i=0;i+1<raw.length;i+=2) busy.push([s+raw[i]*M,s+raw[i+1]*M]);
  const tz=d.tz||undefined, fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,hour:"2-digit",minute:"2-digit",weekday:"short"});
  const ownerTime=t=>{const p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return {min:(+p.hour%24)*60+(+p.minute),wd:p.weekday};};
  const out=[]; let t=Math.max(s,Math.ceil((Date.now()+60*M)/(30*M))*30*M);
  for(;t+len<=end;t+=step){const a=ownerTime(t);
    if(a.min<d.h[0]*60||a.min+d.m>d.h[1]*60) continue;
    if(!d.w&&(a.wd==="Sat"||a.wd==="Sun")) continue;
    out.push({t,busy:busy.some(([x,y])=>x<t+len&&y>t)});}
  return out;
}
const MINE=new Set();
function drawGroup(){
  const who=D.n||"them";
  if(Date.now()>(D.s+D.x)*60000) return fail(`This link has expired. Ask ${who} for a new one.`);
  const C=cells(D), days=[...new Set(C.map(c=>dkey(c.t)))];
  const tf=t=>new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  const rows=[...new Set(C.map(c=>{const x=new Date(c.t);return x.getHours()*60+x.getMinutes();}))].sort((a,b)=>a-b);
  const at=(k,m)=>C.find(c=>dkey(c.t)===k&&new Date(c.t).getHours()*60+new Date(c.t).getMinutes()===m);
  app.innerHTML=`<div class="top">${YOLK}<h1>${esc(D.t||"Find a time")}</h1></div>
    <p class="sub">With ${esc(who)}, ${D.m} minutes. Tap every time that works for you.</p>
    ${C.some(c=>!c.busy)?`<div class="grid"><table><tr><th></th>${days.map(k=>{const x=new Date(k);return `<th>${x.toLocaleDateString(undefined,{weekday:"short"})}<b>${x.getDate()}</b></th>`;}).join("")}</tr>
      ${rows.map(m=>`<tr><td class="tm">${m%60?"":esc(tf(new Date(2000,0,1,Math.floor(m/60),m%60)))}</td>${days.map(k=>{const c=at(k,m);
        return `<td><button type="button" class="cell ${!c?"none":c.busy?"busy":MINE.has(c.t)?"on":""}" ${c&&!c.busy?`data-c="${c.t}" aria-pressed="${MINE.has(c.t)}"`:"disabled"}
          aria-label="${c?esc(new Date(c.t).toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})):""}">${c?.busy?"Busy":""}</button></td>`;}).join("")}</tr>`).join("")}</table></div>
      <div class="legend"><span><i></i>Works for you</span><span><i class="b"></i>${esc(who)} is busy</span></div>
      <form id="f"><label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="60" required>
      <button class="go" id="go" ${MINE.size?"":"disabled"}>${MINE.size?`Send ${MINE.size} time${MINE.size>1?"s":""}`:"Tap the times that work"}</button></form>`
      :`<div class="none">No free times left on this link. Ask ${esc(who)} for a new one.</div>`}
    <p class="tz">Times are in your time zone (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}).</p>`;
  let down=null;   // drag across with a mouse to mark many at once
  app.querySelectorAll("[data-c]").forEach(b=>{const t=+b.dataset.c;
    const set=on=>{on?MINE.add(t):MINE.delete(t);b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);
      const g=$("#go");if(g){g.disabled=!MINE.size;g.textContent=MINE.size?`Send ${MINE.size} time${MINE.size>1?"s":""}`:"Tap the times that work";}};
    b.onclick=e=>{if(e.detail===0||!b.dataset.dragged)set(!MINE.has(t));delete b.dataset.dragged;};
    b.onpointerdown=e=>{if(e.pointerType!=="mouse")return;down=!MINE.has(t);set(down);b.dataset.dragged=1;};
    b.onpointerenter=()=>{if(down!==null){set(down);b.dataset.dragged=1;}};});
  addEventListener("pointerup",()=>{down=null;},{once:true});
  const nm=$("#nm");if(nm)nm.value=sessionStorage.getItem("yk-name")||"";
  const f=$("#f"); if(f) f.onsubmit=e=>{e.preventDefault();sendGroup();};
}
function sendGroup(){
  const name=$("#nm").value.replace(/[\r\n]+/g," ").trim().slice(0,60);
  if(!name) return $("#nm").focus();
  try{sessionStorage.setItem("yk-name",name);}catch{}
  const ts=[...MINE].sort((a,b)=>a-b), b36=n=>n.toString(36);
  const byDay={};ts.forEach(t=>{const k=new Date(t).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    (byDay[k]=byDay[k]||[]).push(new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}));});
  const subject=`${D.t||"Finding a time"}: ${name}'s times`;
  const body=`Hi${D.n?" "+D.n:""},\n\nThese times work for ${name} (${D.m} minutes):\n${Object.entries(byDay).map(([k,v])=>`${k}: ${v.join(", ")}`).join("\n")}\n\nSent from your group link.\nYK-POLL v1 k=${D.k} d=${D.m} at=${ts.map(t=>b36(Math.round(t/60000)-D.s)).join(".")} name=${name}\n`;
  location.href=`mailto:${encodeURIComponent(D.e).replace(/%40/g,"@")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  app.innerHTML=`<div class="top">${YOLK}<h1>Almost done</h1></div>
    <div class="done"><h2>Tap Send in your email</h2><p>${esc(D.n||"They")} will see the time that works for everyone and send the invite.</p>
    <p style="margin-top:16px">Email didn't open? Send this to <b>${esc(D.e)}</b>:</p><pre>${esc(subject)}\n\n${esc(body)}</pre>
    <button class="lnk" id="back">Change my times</button></div>`;
  $("#back").onclick=()=>drawGroup();
}
let D, S=[], day="", pick=0;
const dkey=t=>new Date(t).toDateString();
function draw(){
  const who=D.n||"them";
  if(Date.now()>(D.s+D.x)*60000) return fail(`This link has expired. Ask ${who} for a new one.`);
  const days=[...new Set(S.map(dkey))];
  if(!day||!days.includes(day)) day=days[0]||"";
  const today=S.filter(t=>dkey(t)===day);
  const tf=t=>new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  app.innerHTML=`<div class="top">${YOLK}<h1>Find a time with ${esc(who)}</h1></div>
    <p class="sub">${D.m} minutes. Pick a time that works for you.</p>
    ${days.length?`<div class="days">${days.map(k=>{const x=new Date(k);return `<button class="day ${k===day?"on":""}" data-day="${esc(k)}"><small>${x.toLocaleDateString(undefined,{weekday:"short"})}</small><b>${x.getDate()}</b></button>`;}).join("")}</div>
      <div class="slots">${today.map(t=>`<button class="slot ${t===pick?"on":""}" data-t="${t}">${tf(t)}</button>`).join("")}</div>`
      :`<div class="none">No free times left on this link. Ask ${esc(who)} for a new one.</div>`}
    ${pick?`<form id="f"><label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="60" required>
      <label for="nt">Anything to add? (optional)</label><textarea id="nt" maxlength="500"></textarea>
      <button class="go" id="go">Request ${esc(new Date(pick).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))}, ${esc(tf(pick))}</button></form>`:""}
    <p class="tz">Times are in your time zone (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}).</p>`;
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{day=b.dataset.day;pick=0;draw();});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{pick=+b.dataset.t;const nm=$("#nm")?.value||"";draw();const n=$("#nm");if(n){n.value=nm;n.focus();}});
  const f=$("#f"); if(f) f.onsubmit=e=>{e.preventDefault();send();};
}
function send(){
  const name=$("#nm").value.replace(/[\r\n]+/g," ").trim().slice(0,60), note=$("#nt").value.trim().slice(0,500);
  if(!name) return $("#nm").focus();
  const when=new Date(pick).toLocaleString(undefined,{weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});
  const subject=`Meeting request: ${name} · ${new Date(pick).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}`;
  const body=`Hi${D.n?" "+D.n:""},\n\n${name} would like to meet on ${when} (${D.m} minutes).${note?"\n\n"+note:""}\n\nSent from your free-times link.\nYK-BOOK v1 k=${D.k} at=${Math.round(pick/1000)} d=${D.m} name=${name}\n`;
  location.href=`mailto:${encodeURIComponent(D.e).replace(/%40/g,"@")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  app.innerHTML=`<div class="top">${YOLK}<h1>Almost done</h1></div>
    <div class="done"><h2>Tap Send in your email</h2><p>Once it's sent, ${esc(D.n||"they")} will get it and the time goes on their calendar.</p>
    <p style="margin-top:16px">Email didn't open? Send this to <b>${esc(D.e)}</b>:</p><pre>${esc(subject)}\n\n${esc(body)}</pre>
    <button class="lnk" id="back">Pick another time</button></div>`;
  $("#back").onclick=()=>{pick=0;draw();};
}
read().then(d=>{D=d;if(d.g)return drawGroup();S=slots(d);draw();}).catch(e=>fail(e.message||"This link doesn't work. Ask for a new one."));
</script>
</body>
</html>
